name: Automated Post-Market EOD Ingestion

on:
  schedule:
    # 15:30 Asia/Ho_Chi_Minh (UTC+7) = 08:30 UTC, Monday through Friday
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated ticker symbols (e.g. FPT,VCB,MBB,MWG,HPG,VN100,VN30)'
        required: false
        default: 'FPT,VCB,MBB,MWG,HPG,VN100,VN30'
      providers:
        description: 'Target providers (e.g. LOTUSMARKET,VNDIRECT)'
        required: false
        default: 'LOTUSMARKET,VNDIRECT'
      force:
        description: 'Force re-run even if already completed'
        type: boolean
        required: false
        default: false

jobs:
  run-eod-ingestion:
    name: Trigger EOD Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Send Authenticated EOD Ingestion Request
        id: trigger
        run: |
          set -e
          API_URL="https://investintel-api.onrender.com/api/v1/system/cron/run-ingestion"
          
          # Prepare JSON payload with bounded scope
          SYMBOLS_JSON="[\"FPT\", \"VCB\", \"MBB\", \"MWG\", \"HPG\", \"VN100\", \"VN30\"]"
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_JSON=$(echo '${{ github.event.inputs.symbols }}' | jq -R 'split(",") | map(gsub("^ +| +$"; ""))')
          fi

          PROVIDERS_JSON="[\"LOTUSMARKET\", \"VNDIRECT\"]"
          if [ -n "${{ github.event.inputs.providers }}" ]; then
            PROVIDERS_JSON=$(echo '${{ github.event.inputs.providers }}' | jq -R 'split(",") | map(gsub("^ +| +$"; ""))')
          fi

          FORCE_VAL="false"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_VAL="true"
          fi

          PAYLOAD=$(jq -n \
            --argjson sym "$SYMBOLS_JSON" \
            --argjson prov "$PROVIDERS_JSON" \
            --argjson force "$FORCE_VAL" \
            '{symbols: $sym, providers: $prov, force: $force}')

          echo "Triggering EOD Ingestion with payload: $PAYLOAD"
          
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Ingestion failed with HTTP $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

      - name: Verify Ingestion History & Provenance
        if: always()
        run: |
          HISTORY_URL="https://investintel-api.onrender.com/api/v1/system/cron/history?limit=5"
          echo "Fetching execution history from: $HISTORY_URL"
          curl -s -X GET "$HISTORY_URL" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" | jq .
